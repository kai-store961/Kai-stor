<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAI STORE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #171717;
    }
    header {
      padding: 24px 15px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    header h1 {
      letter-spacing: 7px;
      margin: 0;
    }
    nav {
      margin-top: 18px;}
    nav a {
      color: #222;
      text-decoration: none;
      margin: 0 12px;
      font-size: 13px;
    }
    .hero {
      background: #171717;
      color: white;
      text-align: center;
      padding: 85px 20px;
    }
    .hero h2 {
      font-size: 38px;
      letter-spacing: 3px;
    }
    .hero p { color: #ccc; }
    .hero a {
      display: inline-block;margin-top: 20px;
      padding: 14px 28px;
      background: white;
      color: black;
      text-decoration: none;
    }
    .products {
      padding: 45px 20px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 800px;
      margin: 25px auto;
    }
    .product {
      background: #f5f5f5;
      padding: 35px 10px;
    }.product h3 { font-size: 15px; }
    .product p { color: #555; }
    button {
      background: #171717;
      color: white;
      border: 0;
      padding: 12px 18px;
      cursor: pointer;
    }
    footer {
      background: #171717;
      color: white;
      text-align: center;
      padding: 25px;
    }
    @media(max-width: 450px) {
      .hero h2 { font-size: 29px; }
    }
  </style>
</head>
<body><header>
  <h1>KAI STORE</h1>
  <nav>
    <a href="#inicio">INICIO</a>
    <a href="#productos">PRODUCTOS</a>
    <a href="#contacto">CONTACTO</a>
  </nav>
</header>

<section class="hero" id="inicio">
  <h2>MENOS, ES MÁS.</h2>
  <p>Minimalismo. Estilo. Identidad.</p>
  <a href="#productos">EXPLORAR COLECCIÓN</a>
</section>

<section class="products" id="productos">
  <h2>PRIMERA COLECCIÓN</h2><p>Diseños minimalistas de KAI STORE.</p>
  <div class="grid">
    <div class="product">
      <h3>CAMISETA MINIMAL</h3>
      <p>$25.00</p>
      <button onclick="addCart('Camiseta Minimal')">Agregar</button>
    </div>
    <div class="product">
      <h3>HOODIE CLASSIC</h3>
      <p>$45.00</p>
      <button onclick="addCart('Hoodie Classic')">Agregar</button>
    </div>
  </div><h3 id="cart">Carrito: 0 productos</h3>
</section>

<footer id="contacto">
  <h3>KAI STORE</h3>
  <p>Tu estilo, tu identidad.</p>
  <p>© 2026 KAI STORE</p>
</footer>

<script>
  let count = 0;
  function addCart(product) {
    count++;
    document.getElementById('cart').textContent =
      'Carrito: ' + count + ' productos';
    alert(product + ' agregado al carrito');
  }
</script>

</body>
</html>
